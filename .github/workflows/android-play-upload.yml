name: Android upload to Google Play
# Builds the signed bundle and sends it to a Google Play track using a Play service account (no personal login).
# Needs the secrets in docs/ANDROID-PLAY-SETUP.md steps 3 and 6. The very first release must be uploaded by hand in Play Console
# (Google's API cannot claim a brand-new app), after which this workflow works for every later build.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status (draft keeps it unpublished so you can press Publish in Play Console)"
        type: choice
        default: draft
        options: [draft, completed]
      version_name:
        description: "Version shown on Google Play"
        default: "1.0.0"
concurrency:
  group: android-play-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Check secrets
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          B: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$A" ] || { echo "ANDROID_KEYSTORE_B64 is missing (docs/ANDROID-PLAY-SETUP.md step 3)"; exit 1; }
          [ -n "$B" ] || { echo "PLAY_SERVICE_ACCOUNT_JSON is missing (docs/ANDROID-PLAY-SETUP.md step 6)"; exit 1; }
      - name: Read pinned game version
        id: lock
        run: echo "version=$(node -p "require('./cartridge.lock.json').version")" >> "$GITHUB_OUTPUT"
      - name: Get the game cartridge
        uses: actions/checkout@v4
        with:
          repository: thejoeyrob/zombie-smash-game
          ref: v${{ steps.lock.outputs.version }}
          token: ${{ secrets.GAME_REPO_TOKEN || github.token }}
          path: game
      - run: cd game && node scripts/build-cartridge.mjs
      - name: Assemble the console and test
        run: |
          cd phone
          npm ci
          node scripts/assemble-www.mjs ../game/dist/cartridge
          npm test
          npx cap sync android
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build signed bundle
        working-directory: phone/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thejoeyrob.zombiesmash
          releaseFiles: phone/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
