name: Android AAB (Google Play)
# Run by hand: Actions -> "Android AAB (Google Play)" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown on Google Play (e.g. 1.0.0)"
        default: "1.0.0"
concurrency:
  group: android-aab
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Read pinned game version
        id: lock
        run: echo "version=$(node -p "require('./cartridge.lock.json').version")" >> "$GITHUB_OUTPUT"
      - name: Get the game cartridge
        uses: actions/checkout@v4
        with:
          repository: thejoeyrob/zombie-smash-game
          ref: v${{ steps.lock.outputs.version }}
          token: ${{ secrets.GAME_REPO_TOKEN || github.token }}   # the default token can read the game repo while it is public; add GAME_REPO_TOKEN (docs/SETUP.md) once it is private
          path: game
      - run: cd game && node scripts/build-cartridge.mjs
      - name: Assemble the console and test
        run: |
          cd phone
          npm ci
          node scripts/assemble-www.mjs ../game/dist/cartridge
          npm test
          npx cap sync android
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_B64 secret is missing (docs/ANDROID-PLAY-SETUP.md, step 3)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build signed bundle
        working-directory: phone/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100)) ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: zombie-smash-android-${{ inputs.version_name }}-build${{ github.run_number }}
          path: phone/android/app/build/outputs/bundle/release/*.aab
